$kind: http-request
name: 'Reactivate created user'
order: 35000
method: PATCH
url: '{{base_url}}/api/users/{{created_user}}'
settings:
  followRedirects: false
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "isActive": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reactivate created user status', () => pm.response.to.have.status(200));
      pm.test('Reactivated', () => pm.expect(pm.response.json().isActive).to.equal(true));
