$kind: http-request
name: 'Login Supervisor'
order: 23000
method: POST
url: '{{base_url}}/api/auth/login'
settings:
  followRedirects: false
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "supervisor.demo",
      "password": "{{demo_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Login Supervisor status', () => pm.response.to.have.status(200));
      pm.test('Expected session role', () => pm.expect(pm.response.json().role).to.equal('Supervisor'));
      const cookie=pm.response.headers.get('Set-Cookie'); if (cookie) pm.collectionVariables.set('session_cookie',cookie.split(';')[0]);
